<div class="contenedor-principal">
    <h1>Cartelera de películas</h1>
    <div class="componente-padre">

        <div class="container pe-4">
            @for (pelicula of arrayPeliculas; track pelicula) {
                <ul>
                    <li><a href="javascript:void(0)" (click)="seleccionarPelicula(pelicula); $event.preventDefault()">{{pelicula.Titulo}}</a></li>
                </ul>
            }
        </div>
    </div>
    <div class="componente-hijo">
        <app-pelicula-component [pelicula]="peliculaSeleccionada"></app-pelicula-component>
    </div>
</div>
